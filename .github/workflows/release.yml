name: release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run the release build and publish nothing
        type: boolean
        default: false

permissions:
  contents: write

# Superseded snapshot runs are pointless, but a tag publish must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-macos-publication:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Stage the macOS Native publication
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macosx-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Resolve publication version
        if: matrix.platform == 'macosx-arm64'
        run: |
          next_patch() {
            local last base major minor patch
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            base="${last:-v0.0.0}"
            base="${base#v}"
            IFS=. read -r major minor patch <<<"$base"
            echo "${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          }
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            version="$(next_patch)"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Stage the macOS Native publication
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToMavenCentralStagingRepository
          -PciVersion=${{ env.RELEASE_VERSION }}

      - name: Upload the macOS Native publication
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: koblas-macos-publication
          path: koblas/build/maven-central-publishing/staging-repository
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish the macOS Native snapshot
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository
          -PciVersion=${{ env.RELEASE_VERSION }}

  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: build-macos-publication
    runs-on: ubuntu-latest
    # The Android publication builds OpenBLAS for two ABIs, which a cold run spends most of an hour on.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags are needed to derive the next snapshot version on a main push.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Reads the build and configuration caches build.yml writes, read-only so release runs
      # never seed them.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      # The Android publication carries an OpenBLAS built with exactly this NDK.
      - name: Install the Android NDK
        run: |
          set -eu
          ndk=$(sed -n 's/^koblas.android.ndkVersion=//p' gradle.properties)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          test -d "$ANDROID_HOME/ndk/$ndk"

      - name: Download the macOS Native publication
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: koblas-macos-publication
          path: build/macos-staging

      # A tag publishes that exact version as a release. Any other ref publishes a snapshot of the
      # next patch, so main always has a consumable build. A dry run takes the release path as far
      # as the tests and stops, so the tag path can be exercised on demand.
      - name: Resolve Version
        run: |
          next_patch() {
            # Release tags only; a prerelease tag must not advance the line.
            local last base major minor patch
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            base="${last:-v0.0.0}"
            base="${base#v}"
            IFS=. read -r major minor patch <<<"$base"
            echo "${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          }
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            version="$(next_patch)"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Build and Test
        if: env.IS_SNAPSHOT == 'false'
        run: >-
          ./gradlew build -PciVersion=${{ env.RELEASE_VERSION }}
         

      - name: Upload test reports
        if: always() && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Stage publications for Maven Central
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToMavenCentralStagingRepository
          -PciVersion=${{ env.RELEASE_VERSION }}

      - name: Substitute the host-built macOS Native publication
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        run: cp -R build/macos-staging/. koblas/build/maven-central-publishing/staging-repository/

      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./gradlew mavenCentralBundle uploadMavenCentralBundle

      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -PciVersion=${{ env.RELEASE_VERSION }}
         
          -x :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository

      - name: Detect pre-release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        run: |
          if [[ "$RELEASE_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
