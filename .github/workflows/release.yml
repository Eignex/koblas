name: release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Build and inspect the signed release bundle without publishing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Superseded snapshot runs are pointless, but a tag publish must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    name: Resolve publication version and revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve publication version
        id: version
        env:
          DRY_RUN: ${{ inputs.dryRun || false }}
        run: .github/scripts/resolve-release-version.sh

  # Automatic snapshots already have a successful build of this revision. Tags and manual runs use
  # the same validation as pull requests, including macOS and the optional runtime configurations.
  validate:
    if: github.event_name != 'workflow_run'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-macos-publication:
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.validate.result == 'success' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: [prepare, validate]
    name: Stage the Apple Native publications
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Stage the Apple Native publications
        if: env.IS_SNAPSHOT == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToMavenCentralStagingRepository
          :koblas:publishIosArm64PublicationToMavenCentralStagingRepository
          :koblas:publishIosSimulatorArm64PublicationToMavenCentralStagingRepository
          -PciVersion="$RELEASE_VERSION"
      - name: Upload the Apple Native publications
        if: env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: koblas-macos-publication
          path: koblas/build/maven-central-publishing/staging-repository
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish the Apple Native snapshots
        if: env.IS_SNAPSHOT == 'true' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository
          :koblas:publishIosArm64PublicationToSonatypeSnapshotsRepository
          :koblas:publishIosSimulatorArm64PublicationToSonatypeSnapshotsRepository
          -PciVersion="$RELEASE_VERSION"

  publish:
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.build-macos-publication.result == 'success'
    needs: [prepare, build-macos-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle-wrapper.properties', '**/*.versions.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-konan-
      - name: Download the Apple Native publications
        if: env.IS_SNAPSHOT == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/download-artifact.py
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" koblas-macos-publication build/macos-staging
      - name: Build and Test
        if: env.IS_SNAPSHOT == 'false'
        run: ./gradlew build lintDocs -PciVersion="$RELEASE_VERSION"
      - name: Upload test reports
        if: always() && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
            koblas-bench/build/reports/tests/
            koblas-bench/build/test-results/
          if-no-files-found: ignore
      - name: Stage publications for Maven Central
        if: env.IS_SNAPSHOT == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishAllPublicationsToMavenCentralStagingRepository
          -PciVersion="$RELEASE_VERSION"
          -x :koblas:publishMacosArm64PublicationToMavenCentralStagingRepository
          -x :koblas:publishIosArm64PublicationToMavenCentralStagingRepository
          -x :koblas:publishIosSimulatorArm64PublicationToMavenCentralStagingRepository
      - name: Substitute the host-built Apple Native publications
        if: env.IS_SNAPSHOT == 'false'
        run: cp -R build/macos-staging/. koblas/build/maven-central-publishing/staging-repository/
      - name: Create Maven Central bundle
        if: env.IS_SNAPSHOT == 'false'
        run: ./gradlew :koblas:mavenCentralBundle -PciVersion="$RELEASE_VERSION"
      - name: Inspect the signed Maven Central bundle
        if: env.IS_SNAPSHOT == 'false'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: >-
          python3 .github/scripts/check-release-bundle.py
          koblas/build/maven-central-publishing/bundle.zip "$RELEASE_VERSION"
      - name: Upload inspected release bundle
        if: env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: koblas-release-bundle
          path: koblas/build/maven-central-publishing/bundle.zip
          if-no-files-found: error
      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./gradlew :koblas:uploadMavenCentralBundle -PciVersion="$RELEASE_VERSION"
      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishAllPublicationsToSonatypeSnapshotsRepository -PciVersion="$RELEASE_VERSION"
          -x :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository
          -x :koblas:publishIosArm64PublicationToSonatypeSnapshotsRepository
          -x :koblas:publishIosSimulatorArm64PublicationToSonatypeSnapshotsRepository
      - name: Detect pre-release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        run: |
          if [[ "$RELEASE_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
