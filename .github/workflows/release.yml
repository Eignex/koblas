name: release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

# Superseded snapshot runs are pointless, but a tag publish must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  prepare:
    if: >-
      github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name ==
      github.repository)
    name: Resolve publication version and revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_snapshot: ${{ steps.version.outputs.is_snapshot }}
      revision: ${{ steps.version.outputs.revision }}
      test_release: ${{ steps.version.outputs.test_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Resolve publication version
        id: version
        run: .github/scripts/resolve-release-version.sh

  # Tags run full validation; automatic snapshots reuse the successful main build.
  validate:
    if: github.event_name != 'workflow_run'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      fullTargets: true
      ciVersion: ${{ needs.prepare.outputs.version }}
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    if: >-
      !cancelled() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || (github.event_name ==
      'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    needs: [ prepare, validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      IS_SNAPSHOT: ${{ needs.prepare.outputs.is_snapshot }}
      IS_TEST_RELEASE: ${{ needs.prepare.outputs.test_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.revision }}
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: 'true'
          native-cache: 'true'
          target-profile: full
      - name: Publish RC to GitHub only
        if: env.IS_TEST_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./gradlew :koblas:publishToGitHubRelease -Ptargets.full -PciVersion="$RELEASE_VERSION"
      - name: Build signed Maven Central bundle
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew -Ptargets.full :koblas:publishAllPublicationsToMavenCentralStagingRepository
          :koblas:mavenCentralBundle -PciVersion="$RELEASE_VERSION"
      - name: Inspect the signed Maven Central bundle
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
          bash .github/scripts/check-release-bundle.sh \
            koblas/build/maven-central-publishing/bundle.zip "$RELEASE_VERSION"
      - name: Upload inspected release bundle
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: koblas-release-bundle
          path: koblas/build/maven-central-publishing/bundle.zip
          if-no-files-found: error
      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./gradlew -Ptargets.full :koblas:uploadMavenCentralBundle -PciVersion="$RELEASE_VERSION"
      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: >-
          ./gradlew -Ptargets.full :koblas:publishAllPublicationsToSonatypeSnapshotsRepository
          -PciVersion="$RELEASE_VERSION"
      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false' && env.IS_TEST_RELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
