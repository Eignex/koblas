name: release

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed
    branches:
      - main
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run the release build and publish nothing
        type: boolean
        default: false

permissions:
  contents: write

# Superseded snapshot runs are pointless, but a tag publish must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-native-resources:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build bundled native resources for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-latest
          - platform: macosx-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install the macOS Fortran compiler
        if: matrix.platform == 'macosx-arm64'
        run: |
          brew install gcc
          echo "FC=$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Install the Linux ARM64 cross-toolchain
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gfortran-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "FC=aarch64-linux-gnu-gfortran" >> "$GITHUB_ENV"

      - name: Build core JVM kernels
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas:buildJvmKernels -Pkoblas.kernels.platform=${{ matrix.platform }}

      - name: Upload core JVM kernels
        uses: actions/upload-artifact@v7
        with:
          name: kernels-${{ matrix.platform }}
          path: koblas/build/kernels/resources
          if-no-files-found: error

      - name: Cache bundled OpenBLAS resources
        id: cache-openblas
        uses: actions/cache@v5
        with:
          path: koblas-openblas/build/openblas
          key: release-openblas-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-openblas/openblas.lock', 'scripts/build-openblas.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled SuiteSparse resources
        id: cache-suitesparse
        uses: actions/cache@v5
        with:
          path: koblas-suitesparse/build/suitesparse
          key: release-suitesparse-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-suitesparse/suitesparse.lock', 'scripts/build-suitesparse.sh', 'koblas-openblas/openblas.lock', 'scripts/build-openblas.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled BASICLU resources
        id: cache-basiclu
        uses: actions/cache@v5
        with:
          path: koblas-basiclu/build/basiclu
          key: release-basiclu-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-basiclu/basiclu.lock', 'koblas-basiclu/native/basiclu_shim.c', 'scripts/build-basiclu.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled HFactor resources
        id: cache-hfactor
        uses: actions/cache@v5
        with:
          path: koblas-hfactor/build/hfactor
          key: release-hfactor-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-hfactor/hfactor.lock', 'koblas-hfactor/native/*', 'scripts/build-hfactor.sh', 'scripts/third-party-notices.sh') }}

      - name: Build bundled OpenBLAS
        if: steps.cache-openblas.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-openblas:buildOpenBlas -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Upload bundled OpenBLAS resources
        uses: actions/upload-artifact@v7
        with:
          name: openblas-${{ matrix.platform }}
          path: koblas-openblas/build/openblas/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Build bundled SuiteSparse
        if: steps.cache-suitesparse.outputs.cache-hit != 'true' && steps.cache-openblas.outputs.cache-hit == 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-suitesparse:buildSuiteSparse -x :koblas-openblas:buildOpenBlas
          -Pkoblas.suitesparse.platform=${{ matrix.platform }}
          -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Build bundled SuiteSparse with OpenBLAS
        if: steps.cache-suitesparse.outputs.cache-hit != 'true' && steps.cache-openblas.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-suitesparse:buildSuiteSparse -Pkoblas.suitesparse.platform=${{ matrix.platform }}
          -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Upload bundled SuiteSparse resources
        uses: actions/upload-artifact@v7
        with:
          name: suitesparse-${{ matrix.platform }}
          path: koblas-suitesparse/build/suitesparse/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Build bundled BASICLU
        if: steps.cache-basiclu.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-basiclu:buildBasiclu -Pkoblas.basiclu.platform=${{ matrix.platform }}

      - name: Upload bundled BASICLU resources
        uses: actions/upload-artifact@v7
        with:
          name: basiclu-${{ matrix.platform }}
          path: koblas-basiclu/build/basiclu/resources
          include-hidden-files: true
          if-no-files-found: error

      # HFactor is a class inside HiGHS rather than a library with an API, so the build compiles it against
      # a shim and reads CXX rather than CC.
      - name: Build bundled HFactor
        if: steps.cache-hfactor.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-hfactor:buildHfactor -Pkoblas.hfactor.platform=${{ matrix.platform }}

      - name: Upload bundled HFactor resources
        uses: actions/upload-artifact@v7
        with:
          name: hfactor-${{ matrix.platform }}
          path: koblas-hfactor/build/hfactor/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Resolve publication version
        if: matrix.platform == 'macosx-arm64'
        run: |
          next_patch() {
            local last base major minor patch
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            base="${last:-v0.0.0}"
            base="${base#v}"
            IFS=. read -r major minor patch <<<"$base"
            echo "${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          }
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            version="$(next_patch)"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Stage the macOS Native publication
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'false'
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToMavenCentralStagingRepository
          -PciVersion=${{ env.RELEASE_VERSION }}

      - name: Upload the macOS Native publication
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: koblas-macos-publication
          path: koblas/build/maven-central-publishing/staging-repository
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish the macOS Native snapshot
        if: matrix.platform == 'macosx-arm64' && env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_sonatypeSnapshotsUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_sonatypeSnapshotsPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository
          -PciVersion=${{ env.RELEASE_VERSION }}

  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: build-native-resources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Tags are needed to derive the next snapshot version on a main push.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Reads the build and configuration caches build.yml writes, read-only so release runs
      # never seed them.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Download bundled OpenBLAS resources
        uses: actions/download-artifact@v8
        with:
          pattern: openblas-*
          path: koblas-openblas/build/openblas/resources
          merge-multiple: true

      - name: Download bundled SuiteSparse resources
        uses: actions/download-artifact@v8
        with:
          pattern: suitesparse-*
          path: koblas-suitesparse/build/suitesparse/resources
          merge-multiple: true

      - name: Download bundled BASICLU resources
        uses: actions/download-artifact@v8
        with:
          pattern: basiclu-*
          path: koblas-basiclu/build/basiclu/resources
          merge-multiple: true

      - name: Download bundled HFactor resources
        uses: actions/download-artifact@v8
        with:
          pattern: hfactor-*
          path: koblas-hfactor/build/hfactor/resources
          merge-multiple: true

      - name: Download core JVM kernels
        uses: actions/download-artifact@v8
        with:
          pattern: kernels-*
          path: koblas/build/kernels/resources
          merge-multiple: true

      - name: Download the macOS Native publication
        if: github.event_name != 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: koblas-macos-publication
          path: build/macos-staging

      # A tag publishes that exact version as a release. Any other ref publishes a snapshot of the
      # next patch, so main always has a consumable build. A dry run takes the release path as far
      # as the tests and stops, so the tag path can be exercised on demand.
      - name: Resolve Version
        run: |
          next_patch() {
            # Release tags only; a prerelease tag must not advance the line.
            local last base major minor patch
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            base="${last:-v0.0.0}"
            base="${base#v}"
            IFS=. read -r major minor patch <<<"$base"
            echo "${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          }
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            version="$(next_patch)"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Verify bundled native resources
        run: >-
          ./gradlew :koblas-openblas:verifyOpenBlasResources
          :koblas-suitesparse:verifySuiteSparseResources :koblas-basiclu:verifyBasicluResources
          :koblas-hfactor:verifyHfactorResources
          -x :koblas-openblas:buildOpenBlas -x :koblas-suitesparse:buildSuiteSparse
          -x :koblas-basiclu:buildBasiclu -x :koblas-hfactor:buildHfactor

      - name: Verify core JVM kernels
        run: ./gradlew :koblas:verifyJvmKernelResources -Pkoblas.kernels.prebuilt=true

      - name: Build and Test
        if: env.IS_SNAPSHOT == 'false'
        run: >-
          ./gradlew build -PciVersion=${{ env.RELEASE_VERSION }}
          -Pkoblas.kernels.prebuilt=true
          -x :koblas-openblas:buildOpenBlas -x :koblas-suitesparse:buildSuiteSparse
          -x :koblas-basiclu:buildBasiclu -x :koblas-hfactor:buildHfactor

      - name: Upload test reports
        if: always() && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Stage publications for Maven Central
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToMavenCentralStagingRepository
          -PciVersion=${{ env.RELEASE_VERSION }} -Pkoblas.kernels.prebuilt=true
          -x :koblas-openblas:buildOpenBlas -x :koblas-suitesparse:buildSuiteSparse
          -x :koblas-basiclu:buildBasiclu -x :koblas-hfactor:buildHfactor

      - name: Substitute the host-built macOS Native publication
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        run: cp -R build/macos-staging/. koblas/build/maven-central-publishing/staging-repository/

      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: ./gradlew mavenCentralBundle uploadMavenCentralBundle

      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -PciVersion=${{ env.RELEASE_VERSION }}
          -Pkoblas.kernels.prebuilt=true
          -x :koblas-openblas:buildOpenBlas -x :koblas-suitesparse:buildSuiteSparse
          -x :koblas-basiclu:buildBasiclu -x :koblas-hfactor:buildHfactor
          -x :koblas:publishMacosArm64PublicationToSonatypeSnapshotsRepository

      - name: Detect pre-release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        run: |
          if [[ "$RELEASE_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
