name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: Run the release build and publish nothing
        type: boolean
        default: false

permissions:
  contents: write

# Superseded snapshot runs are pointless, but a tag publish must never be cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-native-resources:
    name: Build bundled native resources for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-latest
          - platform: macosx-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Install the macOS Fortran compiler
        if: matrix.platform == 'macosx-arm64'
        run: |
          brew install gcc
          echo "FC=$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' -print -quit)" >> "$GITHUB_ENV"

      - name: Install the Linux ARM64 cross-toolchain
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gfortran-aarch64-linux-gnu
          echo "CC=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "FC=aarch64-linux-gnu-gfortran" >> "$GITHUB_ENV"

      - name: Cache bundled OpenBLAS resources
        id: cache-openblas
        uses: actions/cache@v5
        with:
          path: koblas-openblas/build/openblas
          key: release-openblas-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-openblas/openblas.lock', 'scripts/build-openblas.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled UMFPACK resources
        id: cache-umfpack
        uses: actions/cache@v5
        with:
          path: koblas-umfpack/build/umfpack
          key: release-umfpack-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-umfpack/umfpack.lock', 'scripts/build-umfpack.sh', 'koblas-openblas/openblas.lock', 'scripts/build-openblas.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled KLU resources
        id: cache-klu
        uses: actions/cache@v5
        with:
          path: koblas-klu/build/klu
          key: release-klu-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-klu/klu.lock', 'scripts/build-klu.sh', 'scripts/third-party-notices.sh') }}

      - name: Cache bundled BASICLU resources
        id: cache-basiclu
        uses: actions/cache@v5
        with:
          path: koblas-basiclu/build/basiclu
          key: release-basiclu-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('koblas-basiclu/basiclu.lock', 'koblas-basiclu/native/basiclu_shim.c', 'scripts/build-basiclu.sh', 'scripts/third-party-notices.sh') }}

      - name: Build bundled OpenBLAS
        if: steps.cache-openblas.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-openblas:buildOpenBlas -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Upload bundled OpenBLAS resources
        uses: actions/upload-artifact@v7
        with:
          name: openblas-${{ matrix.platform }}
          path: koblas-openblas/build/openblas/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Build bundled KLU
        if: steps.cache-klu.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-klu:buildKlu -Pkoblas.klu.platform=${{ matrix.platform }}

      - name: Upload bundled KLU resources
        uses: actions/upload-artifact@v7
        with:
          name: klu-${{ matrix.platform }}
          path: koblas-klu/build/klu/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Build bundled UMFPACK
        if: steps.cache-umfpack.outputs.cache-hit != 'true' && steps.cache-openblas.outputs.cache-hit == 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-umfpack:buildUmfpack -x :koblas-openblas:buildOpenBlas
          -Pkoblas.umfpack.platform=${{ matrix.platform }}
          -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Build bundled UMFPACK with OpenBLAS
        if: steps.cache-umfpack.outputs.cache-hit != 'true' && steps.cache-openblas.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-umfpack:buildUmfpack -Pkoblas.umfpack.platform=${{ matrix.platform }}
          -Pkoblas.openblas.platform=${{ matrix.platform }}

      - name: Upload bundled UMFPACK resources
        uses: actions/upload-artifact@v7
        with:
          name: umfpack-${{ matrix.platform }}
          path: koblas-umfpack/build/umfpack/resources
          include-hidden-files: true
          if-no-files-found: error

      - name: Build bundled BASICLU
        if: steps.cache-basiclu.outputs.cache-hit != 'true'
        run: >-
          ./gradlew --no-build-cache --no-configuration-cache --rerun-tasks
          :koblas-basiclu:buildBasiclu -Pkoblas.basiclu.platform=${{ matrix.platform }}

      - name: Upload bundled BASICLU resources
        uses: actions/upload-artifact@v7
        with:
          name: basiclu-${{ matrix.platform }}
          path: koblas-basiclu/build/basiclu/resources
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build-native-resources
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are needed to derive the next snapshot version on a main push.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Reads the build and configuration caches build.yml writes, read-only so release runs
      # never seed them.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Download bundled OpenBLAS resources
        uses: actions/download-artifact@v8
        with:
          pattern: openblas-*
          path: koblas-openblas/build/openblas/resources
          merge-multiple: true

      - name: Download bundled KLU resources
        uses: actions/download-artifact@v8
        with:
          pattern: klu-*
          path: koblas-klu/build/klu/resources
          merge-multiple: true

      - name: Download bundled UMFPACK resources
        uses: actions/download-artifact@v8
        with:
          pattern: umfpack-*
          path: koblas-umfpack/build/umfpack/resources
          merge-multiple: true

      - name: Download bundled BASICLU resources
        uses: actions/download-artifact@v8
        with:
          pattern: basiclu-*
          path: koblas-basiclu/build/basiclu/resources
          merge-multiple: true

      # A tag publishes that exact version as a release. Any other ref publishes a snapshot of the
      # next patch, so main always has a consumable build. A dry run takes the release path as far
      # as the tests and stops, so the tag path can be exercised on demand.
      - name: Resolve Version
        run: |
          next_patch() {
            # Release tags only; a prerelease tag must not advance the line.
            local last base major minor patch
            last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
            base="${last:-v0.0.0}"
            base="${base#v}"
            IFS=. read -r major minor patch <<<"$base"
            echo "${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))"
          }
          if [[ "${{ inputs.dryRun }}" == "true" ]]; then
            version="$(next_patch)"
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(next_patch)-SNAPSHOT"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Verify bundled native resources
        run: >-
          ./gradlew :koblas-openblas:verifyOpenBlasResources :koblas-klu:verifyKluResources
          :koblas-umfpack:verifyUmfpackResources :koblas-basiclu:verifyBasicluResources
          -x :koblas-openblas:buildOpenBlas -x :koblas-klu:buildKlu
          -x :koblas-umfpack:buildUmfpack -x :koblas-basiclu:buildBasiclu

      - name: Build and Test
        if: env.IS_SNAPSHOT == 'false'
        run: >-
          ./gradlew build -PciVersion=${{ env.RELEASE_VERSION }}
          -x :koblas-openblas:buildOpenBlas -x :koblas-klu:buildKlu
          -x :koblas-umfpack:buildUmfpack -x :koblas-basiclu:buildBasiclu

      - name: Upload test reports
        if: always() && env.IS_SNAPSHOT == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

      - name: Publish to Maven Central (Portal)
        if: env.IS_SNAPSHOT == 'false' && env.DRY_RUN != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishToMavenCentral -PciVersion=${{ env.RELEASE_VERSION }}
          -x :koblas-openblas:buildOpenBlas -x :koblas-klu:buildKlu
          -x :koblas-umfpack:buildUmfpack -x :koblas-basiclu:buildBasiclu

      - name: Publish to Sonatype Snapshots
        if: env.IS_SNAPSHOT == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAllPublicationsToSonatypeSnapshotsRepository -PciVersion=${{ env.RELEASE_VERSION }}
          -x :koblas-openblas:buildOpenBlas -x :koblas-klu:buildKlu
          -x :koblas-umfpack:buildUmfpack -x :koblas-basiclu:buildBasiclu

      - name: Detect pre-release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        run: |
          if [[ "$RELEASE_VERSION" == *"-"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.IS_SNAPSHOT == 'false'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
