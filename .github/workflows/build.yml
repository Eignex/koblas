name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

env:
  # A fresh coordinate prevents consumer builds from resolving an earlier staged JAR or klib.
  CONSUMER_VERSION: 0.0.0-consumer-${{ github.run_id }}-${{ github.run_attempt }}

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Linux checks and vendor conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'

      # Portable conformance needs a host without a vendor library. Install oneMKL only afterwards;
      # Gradle starts fresh test JVMs for its interface checks and the SIMD-enabled test run.
      - name: Run portable JVM conformance
        run: >-
          ./gradlew :koblas:jvmTest --rerun :koblas-bench:jvmTest --rerun -Pkoblas.noSimd=true
      - name: Upload portable test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-portable-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
      - name: Cache oneMKL runtime package
        uses: actions/cache@v6
        with:
          path: ~/onemkl-packages
          key: onemkl-${{ runner.os }}-${{ hashFiles('.github/scripts/install-onemkl.sh') }}
      - name: Install oneMKL
        timeout-minutes: 30
        run: .github/scripts/install-onemkl.sh "$HOME/onemkl-packages"
      # Installed libraries are outside Gradle's test inputs, so cached results cannot validate this host.
      - name: Require both oneMKL interface checks and run JVM tests
        run: >-
          ./gradlew :koblas:oneMklInheritedInterfaceCheck :koblas:oneMklInitializedInterfaceCheck
          :koblas:jvmTest --rerun -Pkoblas.requireOneMkl=true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-onemkl
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      # The loader probes this symlink directly. Hide it so the BLIS run selects BLIS on every CPU.
      - name: Hide oneMKL before BLIS conformance
        run: sudo unlink /opt/intel/oneapi/mkl/latest

      - name: Cache the vendor library packages
        id: vendor-packages
        uses: actions/cache@v6
        with:
          path: ~/vendor-packages
          key: vendor-blis-${{ runner.os }}-${{ env.ImageOS }}-v1

      - name: Install BLIS
        timeout-minutes: 30
        run: .github/scripts/install-host-blas.sh "$HOME/vendor-packages" libblis4-serial

      # Debian keeps each threading flavour of BLIS in a directory of its own and exposes only the reference
      # libblas alternative out of it, so the soname the binding dlopens is not on the loader path as shipped.
      - name: Put BLIS on the loader path
        run: |
          set -eu
          echo /usr/lib/x86_64-linux-gnu/blis-serial | sudo tee /etc/ld.so.conf.d/blis-serial.conf
          sudo ldconfig

      # Fail here rather than let every dense test report the same missing library separately.
      - name: Verify the vendor soname
        run: |
          set -eu
          if ! ldconfig -p | grep -q libblis.so.4; then
            echo "::error::libblis.so.4 is not on the loader path; the dense vendor tests cannot run"
            exit 1
          fi
          ldconfig -p | grep libblis.so.4

      - name: Validate CI scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
          bash .github/scripts/test-ci-scripts.sh
          bash tests/test-verification-scripts.sh
          bash koblas-bench/test-scripts.sh
          bash .github/scripts/test-consumer-ci.sh

      # One task graph shares compilation and analysis between checks and documentation lint.
      - name: Run checks and documentation lint with coverage
        run: >-
          ./gradlew check lintDocs :koblas:koverXmlReport
          :koblas:jvmTest --rerun :koblas:jvmTestJarOnJava25 --rerun :koblas-bench:jvmTest --rerun

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          disable_search: true
          flags: reference
          fail_ci_if_error: false

      # The binding dlopens by soname, so the runtime libraries are what matter.
      #
      # Cached as .deb files, so a hit installs with no mirror access at all. Keyed on the image as well as
      # the package list: ubuntu-latest moves between releases, and unpacking one release's debs on another
      # would be worse than a slow download.
      - name: Cache the benchmark library packages
        id: host-packages
        uses: actions/cache@v6
        with:
          path: ~/host-packages
          key: benchmark-openblas-${{ runner.os }}-${{ env.ImageOS }}-v1

      - name: Install OpenBLAS
        timeout-minutes: 30
        run: .github/scripts/install-host-blas.sh "$HOME/host-packages" libopenblas0 libopenblas-dev

      # Fail here rather than let optional comparator tests return early on an absent library.
      - name: Verify the comparator soname
        run: |
          set -eu
          for soname in libopenblas.so.0; do
            if ! ldconfig -p | grep -q "$soname"; then
              echo "::error::$soname is not on the loader path; the benchmark comparator cannot run"
              exit 1
            fi
            echo "found $soname"
          done

      - name: Run comparator correctness tests
        run: >-
          ./gradlew :koblas-bench:jvmTest
          --tests com.eignex.koblas.bench.BenchmarkArmResolutionTest

      - name: Smoke-test JVM benchmark resolution
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:jvmSelectedBenchmark \
            -Pbench.include=Level3Benchmark.gemm \
            -Pbench.param.n=64 -Pbench.param.denseArm=openblas 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the JVM OpenBLAS comparator failed inside the benchmark fork"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas threading=1 thread' "$log"

      - name: Smoke-test Linux Native resolution and cross-compile arm64 tests
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:linuxX64SelectedBenchmark \
            :koblas:linkDebugTestLinuxArm64 :koblas-bench:linkDebugTestLinuxArm64 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the Linux Native OpenBLAS comparator failed inside the benchmark process"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas-native threading=1 thread' "$log"

      - name: Package arm64 test executables
        run: |
          mkdir -p build
          tar -czf build/linux-arm64-tests.tar.gz \
            koblas/build/bin/linuxArm64/debugTest/test.kexe \
            koblas-bench/build/bin/linuxArm64/debugTest/test.kexe
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-tests
          path: build/linux-arm64-tests.tar.gz
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-openblas-comparator
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon.
  test-macos:
    name: Run JVM and native tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'

      # Cache extraction and first-boot migration both write heavily to the runner's disk.
      - name: Start the iOS simulator in the background
        run: |
          mkdir -p "$RUNNER_TEMP/ios-simulator"
          nohup bash .github/scripts/boot-ios-simulator.sh "$RUNNER_TEMP/ios-simulator" \
            > "$RUNNER_TEMP/ios-simulator/boot.log" 2>&1 < /dev/null &

      # One linker at a time shares the runner with the booting simulator without oversubscribing it.
      - name: Run JVM and macOS tests and prepare the iOS publication and tests
        run: >-
          ./gradlew :koblas:jvmTest :koblas:macosArm64Test :koblas:linkDebugTestIosSimulatorArm64
          :koblas:publishKotlinMultiplatformPublicationToLocalStagingRepository
          :koblas:publishIosArm64PublicationToLocalStagingRepository
          :koblas:publishIosSimulatorArm64PublicationToLocalStagingRepository
          -PciVersion="$CONSUMER_VERSION" --max-workers=1
      - name: Link published iOS consumer tests and device and simulator frameworks
        run: >-
          ./gradlew -p tests/ios-consumer linkDebugTestIosSimulatorArm64
          linkDebugFrameworkIosArm64 linkDebugFrameworkIosSimulatorArm64 --max-workers=1
          -Pconsumer.version="$CONSUMER_VERSION"
      - name: Wait for the iOS simulator
        timeout-minutes: 10
        run: |
          while [[ ! -f "$RUNNER_TEMP/ios-simulator/status" ]]; do sleep 1; done
          cat "$RUNNER_TEMP/ios-simulator/boot.log"
          test "$(cat "$RUNNER_TEMP/ios-simulator/status")" = 0
          echo "IOS_SIMULATOR_DEVICE=$(cat "$RUNNER_TEMP/ios-simulator/device")" >> "$GITHUB_ENV"
      # Simulator tests run after all linking, with no compiler competing for the runner's CPU.
      - name: Run iOS portable conformance
        run: >-
          ./gradlew :koblas:iosSimulatorArm64Test --max-workers=1
          -PciVersion="$CONSUMER_VERSION" -PiosSimulatorDevice="$IOS_SIMULATOR_DEVICE"
      - name: Run the published iOS consumer
        run: >-
          ./gradlew -p tests/ios-consumer iosSimulatorArm64Test --max-workers=1
          -Pconsumer.version="$CONSUMER_VERSION"
          -PiosSimulatorDevice="$IOS_SIMULATOR_DEVICE"
      - name: Require executed simulator tests and linked frameworks
        run: |
          bash tests/verify-test-results.sh koblas/build/test-results/iosSimulatorArm64Test tests/ios-consumer/build/test-results/iosSimulatorArm64Test
          test -s tests/ios-consumer/build/bin/iosArm64/debugFramework/KoblasConsumer.framework/KoblasConsumer
          test -s tests/ios-consumer/build/bin/iosSimulatorArm64/debugFramework/KoblasConsumer.framework/KoblasConsumer
      - name: Summarize macOS and iOS test timings
        if: always()
        run: |
          bash .github/scripts/summarize-test-results.sh \
            koblas/build/test-results/macosArm64Test koblas/build/test-results/iosSimulatorArm64Test \
            tests/ios-consumer/build/test-results/iosSimulatorArm64Test >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Kotlin/Native builds final Linux binaries on x64 hosts. Execute the cross-built tests on real arm64.
  test-linux-arm64:
    name: Run Linux arm64 native tests
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Download and verify Linux arm64 tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/download-artifact.sh
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" linux-arm64-tests build
      - name: Run portable native conformance on arm64
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          tar -xzf build/linux-arm64-tests.tar.gz
          mkdir -p build/test-results/linuxArm64
          koblas/build/bin/linuxArm64/debugTest/test.kexe 2>&1 | tee build/test-results/linuxArm64/koblas.log
          koblas-bench/build/bin/linuxArm64/debugTest/test.kexe 2>&1 | tee build/test-results/linuxArm64/koblas-bench.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-arm64
          path: build/test-results/linuxArm64/
          if-no-files-found: ignore

  build-shared-jvm-artifact:
    name: Build and verify the shared JVM and Android consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Stage the shared Maven publication
        run: >-
          ./gradlew :koblas:publishJvmPublicationToLocalStagingRepository
          :koblas:publishKotlinMultiplatformPublicationToLocalStagingRepository
          -PciVersion="$CONSUMER_VERSION"
      - name: Verify the bytecode boundary and published JVM requirement
        run: |
          bash tests/verify-jvm-artifact.sh \
            "koblas/build/libs/koblas-jvm-$CONSUMER_VERSION.jar" koblas/build/publications/jvm/module.json
          jar --validate --file "koblas/build/libs/koblas-jvm-$CONSUMER_VERSION.jar"
      - name: Build JVM and Android consumers of the same publication
        run: >-
          ./gradlew -p tests/consumers :jvm:jvm17Consumer :jvm:jvm25Consumer
          :jvm:jvm17ModuleConsumer :jvm:jvm25ModuleConsumer
          :android:assembleDebug :android:assembleRelease :android:assembleDebugAndroidTest
          -Pconsumer.version="$CONSUMER_VERSION"
      - name: Build the R8 instrumentation APK
        run: >-
          ./gradlew -p tests/consumers :android:assembleReleaseAndroidTest
          -Pconsumer.buildType=release -Pconsumer.version="$CONSUMER_VERSION"
      - name: Verify both Android APKs contain only portable code
        run: |
          bash tests/verify-jvm-artifact.sh \
            "koblas/build/libs/koblas-jvm-$CONSUMER_VERSION.jar" koblas/build/publications/jvm/module.json \
            tests/consumers/android/build/outputs/apk/debug/android-debug.apk \
            tests/consumers/android/build/outputs/apk/release/android-release.apk
      - name: Package the verified Android consumers
        run: |
          mkdir -p build/android-consumer-apks/{debug,release}
          for variant in debug release; do
            cp "tests/consumers/android/build/outputs/apk/$variant/android-$variant.apk" \
              "build/android-consumer-apks/$variant/app.apk"
            cp "tests/consumers/android/build/outputs/apk/androidTest/$variant/android-$variant-androidTest.apk" \
              "build/android-consumer-apks/$variant/test.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: android-consumer-apks
          path: build/android-consumer-apks/
          if-no-files-found: error

  test-shared-jvm-artifact:
    name: Run Android consumers on API 24 and 34
    needs: build-shared-jvm-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Download and verify the Android consumers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/download-artifact.sh
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" android-consumer-apks build/android-consumer-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Identify the runner image
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Run Android API 24 consumers
        id: api24
        continue-on-error: true
        uses: ./.github/actions/test-android-consumer
        with:
          api-level: '24'
          image-version: ${{ steps.image.outputs.version }}
      - name: Run Android API 34 consumers
        id: api34
        continue-on-error: true
        uses: ./.github/actions/test-android-consumer
        with:
          api-level: '34'
          image-version: ${{ steps.image.outputs.version }}
      - name: Require both Android runtimes
        if: ${{ !cancelled() }}
        env:
          API_24_RESULT: ${{ steps.api24.outcome }}
          API_34_RESULT: ${{ steps.api34.outcome }}
        run: |
          test "$API_24_RESULT" = success
          test "$API_34_RESULT" = success
      - name: Upload Android consumer test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-jvm-android
          path: build/test-results/android/
          if-no-files-found: ignore
