name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run linter
        run: ./gradlew lintDocs

      # linuxX64Test is excluded so this job needs no host libraries at all. Its native suites are the only
      # thing here that would touch them: the JVM side pins `koblas.backend=reference` and filters the
      # HostLibraryTest category out, and CblasConformanceTest and UmfpackNativeConformanceTest both require
      # their library rather than skipping, since Kotlin/Native has no Assume and a skipped suite reads as
      # green. test-host-libraries already runs linuxX64Test with the libraries installed, so nothing is
      # lost, and Kover measures the JVM only so coverage is unaffected. Not installing them keeps a slow
      # package mirror from being able to stall this job.
      - name: Run tests with coverage
        run: ./gradlew check koverXmlReport -x :koblas:linuxX64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: reference
          fail_ci_if_error: false

  # The default job pins `koblas.backend=reference` and filters the HostLibraryTest category out, so the
  # OpenBLAS and SuiteSparse bindings — which auto-register in any JVM/Linux consumer process — are never
  # exercised there. This job is the one that runs them.
  #
  # Kept separate rather than folded into `test` because these measure the machine as much as the library,
  # so a box without SuiteSparse would report a different everyday result. Coverage is collected here too and
  # uploaded under its own flags; codecov takes the union across a commit's uploads, which is what makes the
  # bindings count. Both configurations upload, since the SIMD one cannot reach the level-2 bindings at all.
  test-host-libraries:
    name: Run tests against the host BLAS and SuiteSparse
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Both backends dlopen by soname, so the runtime libraries are what matter. libsuitesparse-dev is
      # named the same across releases where the versioned runtime package (libumfpack5/6) is not.
      #
      # Retried, and bounded by the step rather than per attempt. An unreachable mirror otherwise stalls here
      # until the whole job is cancelled, which costs 45 minutes and reports as a test failure.
      #
      # Observed install durations: 11 to 18 seconds normally, and 117 to 156 seconds on a degraded mirror
      # that still works. A per-attempt cap below that range cannot distinguish slow from stuck and kills
      # installs that would have finished, so the retry loop is left uncapped and the step bound does the
      # cutting. The retry then covers what it is actually good for, an attempt that fails fast.
      - name: Install OpenBLAS and SuiteSparse
        timeout-minutes: 8
        run: |
          set -eu
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --no-install-recommends \
                 libopenblas0 liblapacke libsuitesparse-dev; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::could not install the host libraries after 3 attempts"
          exit 1

      # Fail here rather than let the tests pass over an absent library: the native tests return early
      # when dlopen finds nothing, which is indistinguishable from success in a report.
      - name: Verify the sonames the bindings look for
        run: |
          set -eu
          for soname in libopenblas.so.0 libumfpack.so; do
            if ! ldconfig -p | grep -q "$soname"; then
              echo "::error::$soname is not on the loader path; the bindings would silently fall back"
              exit 1
            fi
            echo "found $soname"
          done

      - name: Run tests against the host libraries
        run: ./gradlew :koblas:jvmTest :koblas:linuxX64Test :koblas:koverXmlReport -Pkoblas.hostTests=true

      - name: Upload host coverage to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: host-simd
          fail_ci_if_error: false

      # The run above never opens the JVM level-2 gate, so dropping the Vector API is what reaches those
      # bindings.
      - name: Run the host tests again with the level-2 bindings reachable
        run: >-
          ./gradlew :koblas:jvmTest :koblas:koverXmlReport
          -Pkoblas.hostTests=true -Pkoblas.noSimd=true --rerun-tasks

      - name: Upload scalar host coverage to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: host-scalar
          fail_ci_if_error: false

      # The JVM host tests skip themselves via Assume when a library is missing, and a skipped suite is a
      # green suite. This turns that back into a failure.
      - name: Fail if the host tests did not actually run
        if: always()
        run: |
          set -eu
          files=$(find koblas/build/test-results -name 'TEST-*.xml' | grep -Ei 'umfpack|cblas|hostblas' || true)
          if [ -z "$files" ]; then
            echo "::error::no host-library test results were produced"
            exit 1
          fi
          status=0
          for f in $files; do
            attrs=$(grep -ho 'tests="[0-9]*"[^>]*skipped="[0-9]*"' "$f" | head -1)
            tests=$(printf '%s' "$attrs" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
            skipped=$(printf '%s' "$attrs" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
            echo "$(basename "$f"): tests=${tests:-0} skipped=${skipped:-0}"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::$(basename "$f") ran nothing or skipped; the host library did not bind"
              status=1
            fi
          done
          exit $status

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-host-libraries
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon, including the host-BLAS backend against Homebrew's OpenBLAS.
  test-macos:
    name: Run native tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # macosTest depends on hostSparseTest as well as hostBlasTest, so this job runs the UMFPACK suite
      # too — and that suite requires its library rather than skipping without it.
      - name: Install OpenBLAS and SuiteSparse
        run: brew install openblas suite-sparse

      - name: Run native tests
        run: ./gradlew :koblas:macosArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore
