name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # koblas dlopens the system OpenBLAS at runtime; only the shared libraries are needed.
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas0 liblapacke

      - name: Run linter
        run: ./gradlew lintDocs

      - name: Run tests with coverage
        run: ./gradlew check koverXmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          fail_ci_if_error: false

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon, including the host-BLAS backend against Homebrew's OpenBLAS.
  test-macos:
    name: Run native tests on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Run native tests
        run: ./gradlew :koblas:macosArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore
