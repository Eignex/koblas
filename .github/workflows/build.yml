name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run linter
        run: ./gradlew lintDocs

      # linuxX64Test is excluded so this job needs no host libraries at all. Its native suites are the only
      # thing here that would touch them: the JVM side pins `koblas.backend=reference` and filters the
      # HostLibraryTest category out, and CblasConformanceTest and UmfpackNativeConformanceTest both require
      # their library rather than skipping, since Kotlin/Native has no Assume and a skipped suite reads as
      # green. test-host-libraries already runs linuxX64Test with the libraries installed, so nothing is
      # lost, and Kover measures the JVM only so coverage is unaffected. Not installing them keeps a slow
      # package mirror from being able to stall this job.
      - name: Run tests with coverage
        run: ./gradlew check koverXmlReport -x :koblas:linuxX64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: reference
          fail_ci_if_error: false

  # The default job pins `koblas.backend=reference` and filters the HostLibraryTest category out, so the
  # OpenBLAS and SuiteSparse bindings — which auto-register in any JVM/Linux consumer process — are never
  # exercised there. This job is the one that runs them.
  #
  # Kept separate rather than folded into `test` because these measure the machine as much as the library,
  # so a box without SuiteSparse would report a different everyday result. Coverage is collected here too and
  # uploaded under its own flags; codecov takes the union across a commit's uploads, which is what makes the
  # bindings count. Both configurations upload, since the SIMD one cannot reach the level-2 bindings at all.
  test-host-libraries:
    name: Run tests against the host BLAS and SuiteSparse
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # Both backends dlopen by soname, so the runtime libraries are what matter. libsuitesparse-dev is
      # named the same across releases where the versioned runtime package (libumfpack5/6) is not.
      #
      # Cached as .deb files, so a hit installs with no mirror access at all. Keyed on the image as well as
      # the package list: ubuntu-latest moves between releases, and unpacking one release's debs on another
      # would be worse than a slow download.
      - name: Cache the host library packages
        id: host-packages
        uses: actions/cache@v5
        with:
          path: ~/host-packages
          key: host-packages-${{ runner.os }}-${{ env.ImageOS }}-openblas-lapacke-suitesparse-v1

      # Generous on purpose: a slow mirror should cost time, never a red build. Observed downloads run 11 to
      # 18 seconds normally, 117 to 156 seconds on a degraded mirror that still works, and sometimes hang
      # indefinitely. Two earlier passes at this were cut too fine, 180s for the step and then 100s per
      # attempt, and both turned a working-but-slow install into a failure. The per-attempt cut is still what
      # makes the retry mean anything, since bounding only the step lets one hung attempt consume the lot.
      #
      # Only the download is bounded and retried. Unpacking is local and cannot hang on the network, and on a
      # cache hit nothing is downloaded at all.
      - name: Install OpenBLAS and SuiteSparse
        timeout-minutes: 30
        run: |
          set -eu
          packages="libopenblas0 liblapacke libsuitesparse-dev"
          cache="$HOME/host-packages"
          # The runner's mirrorlist leads with azure.archive.ubuntu.com, which has been unreachable: apt waits
          # on it for every index file, logs Ign, and only then falls back to archive.ubuntu.com, which answers
          # fine. That accumulated per-index wait is the difference between an 11 second install and a 20
          # minute one. Pointing at the mirror that answers skips it, and a short acquire timeout keeps a
          # future dead host from being waited on rather than abandoned.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirrors"
            echo "mirrorlist now:"; cat "$mirrors"
          fi
          opts="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          if [ -z "$(ls -A "$cache" 2>/dev/null || true)" ]; then
            mkdir -p "$cache"
            # Cleared first so the cache holds this closure and not whatever the image had lying around.
            sudo apt-get clean
            for attempt in 1 2; do
              if timeout 600 sudo apt-get $opts update && \
                 timeout 600 sudo apt-get $opts install -y --no-install-recommends --download-only $packages; then
                sudo cp /var/cache/apt/archives/*.deb "$cache"/
                sudo chown -R "$(id -u):$(id -g)" "$cache"
                break
              fi
              echo "attempt $attempt failed"
              # A killed apt can leave dpkg mid-transaction, which would fail the next attempt for an
              # unrelated reason.
              sudo dpkg --configure -a || true
              sleep 5
            done
          else
            echo "using $(ls -1 "$cache"/*.deb | wc -l) cached packages"
          fi
          if [ -z "$(ls -A "$cache" 2>/dev/null || true)" ]; then
            echo "::error::could not download the host libraries; the package mirror is likely unreachable"
            exit 1
          fi
          # One dpkg call over the whole closure, so it can work out the unpack and configure order itself.
          sudo dpkg -i "$cache"/*.deb

      # Fail here rather than let the tests pass over an absent library: the native tests return early
      # when dlopen finds nothing, which is indistinguishable from success in a report.
      - name: Verify the sonames the bindings look for
        run: |
          set -eu
          for soname in libopenblas.so.0 libumfpack.so; do
            if ! ldconfig -p | grep -q "$soname"; then
              echo "::error::$soname is not on the loader path; the bindings would silently fall back"
              exit 1
            fi
            echo "found $soname"
          done

      - name: Run tests against the host libraries
        run: ./gradlew :koblas:jvmTest :koblas:linuxX64Test :koblas:koverXmlReport -Pkoblas.hostTests=true

      - name: Upload host coverage to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: host-simd
          fail_ci_if_error: false

      # The run above never opens the JVM level-2 gate, so dropping the Vector API is what reaches those
      # bindings.
      - name: Run the host tests again with the level-2 bindings reachable
        run: >-
          ./gradlew :koblas:jvmTest :koblas:koverXmlReport
          -Pkoblas.hostTests=true -Pkoblas.noSimd=true --rerun-tasks

      - name: Upload scalar host coverage to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: host-scalar
          fail_ci_if_error: false

      # The JVM host tests skip themselves via Assume when a library is missing, and a skipped suite is a
      # green suite. This turns that back into a failure.
      - name: Fail if the host tests did not actually run
        if: always()
        run: |
          set -eu
          files=$(find koblas/build/test-results -name 'TEST-*.xml' | grep -Ei 'umfpack|cblas|hostblas' || true)
          if [ -z "$files" ]; then
            echo "::error::no host-library test results were produced"
            exit 1
          fi
          status=0
          for f in $files; do
            attrs=$(grep -ho 'tests="[0-9]*"[^>]*skipped="[0-9]*"' "$f" | head -1)
            tests=$(printf '%s' "$attrs" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p')
            skipped=$(printf '%s' "$attrs" | sed -n 's/.*skipped="\([0-9]*\)".*/\1/p')
            echo "$(basename "$f"): tests=${tests:-0} skipped=${skipped:-0}"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::$(basename "$f") ran nothing or skipped; the host library did not bind"
              status=1
            fi
          done
          exit $status

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-host-libraries
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

  # This intentionally runs before any system packages are installed. It exercises the optional Maven
  # artifact exactly as a consumer does: its own native resources, extraction, FFM load, and service
  # registration must all work without the host OpenBLAS or LAPACKE paths.
  #
  # The standard Linux test job already exercises the x64 bundle through `check`. This runner covers the
  # remaining Linux architecture, where resource and dependent-library mistakes differ from x64.
  test-openblas-bundle:
    name: Run the Maven OpenBLAS bundle on Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # buildOpenBlas writes both its downloaded source archive and generated resources under this
      # directory. The full platform tuple and the two task inputs make this cache safe to restore only
      # for the binary it was built for; deliberately no restore-keys can select another architecture.
      - name: Cache native OpenBLAS build resources
        uses: actions/cache@v5
        with:
          path: koblas-openblas/build/openblas
          key: openblas-${{ runner.os }}-${{ runner.arch }}-linux-arm64-${{ hashFiles('koblas-openblas/openblas.lock', 'scripts/build-openblas.sh') }}

      - name: Run the Maven OpenBLAS bundle tests without host libraries
        run: ./gradlew :koblas-openblas:test --rerun-tasks

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon, including the host-BLAS backend against Homebrew's OpenBLAS.
  test-macos:
    name: Run native tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Install the macOS Fortran compiler
        run: |
          brew install gcc
          echo "FC=$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' -print -quit)" >> "$GITHUB_ENV"

      # This must stay before Homebrew: it verifies that a JVM consumer can use the optional Maven
      # artifact on Apple Silicon without a host OpenBLAS installation. GCC supplies the toolchain used to
      # build the bundled source, not an OpenBLAS runtime library.
      - name: Run the Maven OpenBLAS bundle tests without host libraries
        run: ./gradlew :koblas-openblas:test --rerun-tasks

      # macosTest depends on hostSparseTest as well as hostBlasTest, so this job runs the UMFPACK suite
      # too — and that suite requires its library rather than skipping without it.
      - name: Install OpenBLAS and SuiteSparse
        run: brew install openblas suite-sparse

      - name: Run native tests
        run: ./gradlew :koblas:macosArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore
