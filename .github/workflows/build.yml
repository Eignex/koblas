name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'

      # Exercise Linux host bindings as well as the portable conformance floor. Serial BLIS reaches the
      # AOCL arm without worker threads; OpenBLAS has its own benchmark comparator job below.
      - name: Cache the vendor library packages
        id: vendor-packages
        uses: actions/cache@v6
        with:
          path: ~/vendor-packages
          key: vendor-blis-${{ runner.os }}-${{ env.ImageOS }}-v1

      - name: Install BLIS
        timeout-minutes: 30
        run: .github/scripts/install-host-blas.sh "$HOME/vendor-packages" libblis4-serial

      # Debian keeps each threading flavour of BLIS in a directory of its own and exposes only the reference
      # libblas alternative out of it, so the soname the binding dlopens is not on the loader path as shipped.
      - name: Put BLIS on the loader path
        run: |
          set -eu
          echo /usr/lib/x86_64-linux-gnu/blis-serial | sudo tee /etc/ld.so.conf.d/blis-serial.conf
          sudo ldconfig

      # Fail here rather than let every dense test report the same missing library separately.
      - name: Verify the vendor soname
        run: |
          set -eu
          if ! ldconfig -p | grep -q libblis.so.4; then
            echo "::error::libblis.so.4 is not on the loader path; the dense vendor tests cannot run"
            exit 1
          fi
          ldconfig -p | grep libblis.so.4

      - name: Validate CI scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
          bash .github/scripts/test-ci-scripts.sh
          bash tests/test-verification-scripts.sh
          bash koblas-bench/test-scripts.sh

      # One task graph shares compilation and analysis between checks and documentation lint.
      - name: Run checks and documentation lint with coverage
        run: ./gradlew check lintDocs :koblas:koverXmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          disable_search: true
          flags: reference
          fail_ci_if_error: false

  # OpenBLAS is a development comparator owned by koblas-bench. Keep its installed-library validation in a
  # separate job so no published module acquires an external dependency or resource.
  test-openblas-comparator:
    name: Validate the OpenBLAS benchmark comparator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'

      # The binding dlopens by soname, so the runtime libraries are what matter.
      #
      # Cached as .deb files, so a hit installs with no mirror access at all. Keyed on the image as well as
      # the package list: ubuntu-latest moves between releases, and unpacking one release's debs on another
      # would be worse than a slow download.
      - name: Cache the benchmark library packages
        id: host-packages
        uses: actions/cache@v6
        with:
          path: ~/host-packages
          key: benchmark-openblas-${{ runner.os }}-${{ env.ImageOS }}-v1

      - name: Install OpenBLAS
        timeout-minutes: 30
        run: .github/scripts/install-host-blas.sh "$HOME/host-packages" libopenblas0 libopenblas-dev

      # Fail here rather than let optional comparator tests return early on an absent library.
      - name: Verify the comparator soname
        run: |
          set -eu
          for soname in libopenblas.so.0; do
            if ! ldconfig -p | grep -q "$soname"; then
              echo "::error::$soname is not on the loader path; the benchmark comparator cannot run"
              exit 1
            fi
            echo "found $soname"
          done

      - name: Run comparator correctness tests
        run: >-
          ./gradlew :koblas-bench:jvmTest
          --tests com.eignex.koblas.bench.BenchmarkArmResolutionTest

      - name: Smoke-test JVM benchmark resolution
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:jvmSelectedBenchmark \
            -Pbench.include=Level3Benchmark.gemm \
            -Pbench.param.n=64 -Pbench.param.denseArm=openblas 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the JVM OpenBLAS comparator failed inside the benchmark fork"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas threading=1 thread' "$log"

      - name: Smoke-test Linux Native benchmark resolution
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:linuxX64SelectedBenchmark \
            -Pbench.include=Level3Benchmark.gemm \
            -Pbench.param.n=64 -Pbench.param.denseArm=openblas 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the Linux Native OpenBLAS comparator failed inside the benchmark process"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas-native threading=1 thread' "$log"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-openblas-comparator
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon.
  test-macos:
    name: Run JVM and native tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'

      - name: Run JVM and native tests
        run: ./gradlew :koblas:jvmTest :koblas:macosArm64Test

      - name: Select an installed iOS simulator
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          devices=$(xcrun simctl list devices available -j)
          selection=$(jq -er '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] |
              select(.name | startswith("iPhone"))] |
            (map(select(.state == "Booted"))[0] // .[0] // error("No installed iPhone simulator")) |
            [.udid, .state] | @tsv' <<<"$devices")
          read -r device state <<<"$selection"
          echo "IOS_SIMULATOR_DEVICE=$device" >> "$GITHUB_ENV"
          if [[ "$state" != Booted ]]; then xcrun simctl boot "$device"; fi
          xcrun simctl bootstatus "$device" -b
      - name: Run iOS portable conformance
        run: >-
          ./gradlew :koblas:iosSimulatorArm64Test --max-workers=2
          -PiosSimulatorDevice="$IOS_SIMULATOR_DEVICE"
      - name: Stage the iOS Maven publications
        run: >-
          ./gradlew :koblas:publishKotlinMultiplatformPublicationToLocalStagingRepository
          :koblas:publishIosArm64PublicationToLocalStagingRepository
          :koblas:publishIosSimulatorArm64PublicationToLocalStagingRepository
          -PciVersion=0.0.0-consumer --max-workers=2
      - name: Consume the published iOS library and link device and simulator frameworks
        run: >-
          ./gradlew -p tests/ios-consumer --refresh-dependencies iosSimulatorArm64Test
          linkDebugFrameworkIosArm64 linkDebugFrameworkIosSimulatorArm64 --max-workers=2
          -PiosSimulatorDevice="$IOS_SIMULATOR_DEVICE"
      - name: Require executed simulator tests and linked frameworks
        run: |
          bash tests/verify-test-results.sh koblas/build/test-results/iosSimulatorArm64Test tests/ios-consumer/build/test-results/iosSimulatorArm64Test
          test -s tests/ios-consumer/build/bin/iosArm64/debugFramework/KoblasConsumer.framework/KoblasConsumer
          test -s tests/ios-consumer/build/bin/iosSimulatorArm64/debugFramework/KoblasConsumer.framework/KoblasConsumer
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  test-onemkl:
    name: Validate portable JVM and oneMKL bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # Portable conformance needs a host without a vendor library. Install oneMKL only afterwards;
      # Gradle starts fresh test JVMs for its interface checks and the SIMD-enabled test run.
      - name: Run portable JVM conformance
        run: ./gradlew :koblas:jvmTest :koblas-bench:jvmTest -Pkoblas.noSimd=true
      - name: Upload portable test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-portable-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
      - name: Cache oneMKL runtime package
        uses: actions/cache@v6
        with:
          path: ~/onemkl-packages
          key: onemkl-${{ runner.os }}-${{ hashFiles('.github/scripts/install-onemkl.sh') }}
      - name: Install oneMKL
        timeout-minutes: 30
        run: .github/scripts/install-onemkl.sh "$HOME/onemkl-packages"
      # Installed libraries are outside Gradle's test inputs, so cached results cannot validate this host.
      - name: Require both oneMKL interface checks and run JVM tests
        run: >-
          ./gradlew :koblas:oneMklInheritedInterfaceCheck :koblas:oneMklInitializedInterfaceCheck
          :koblas:jvmTest --rerun -Pkoblas.requireOneMkl=true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-onemkl
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Kotlin/Native builds final Linux binaries on x64 hosts. Execute the cross-built tests on real arm64.
  build-linux-arm64-tests:
    name: Build Linux arm64 native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          native-cache: 'true'
      - name: Cross-compile native conformance tests
        run: ./gradlew :koblas:linkDebugTestLinuxArm64 :koblas-bench:linkDebugTestLinuxArm64
      - name: Package test executables
        run: |
          mkdir -p build
          tar -czf build/linux-arm64-tests.tar.gz \
            koblas/build/bin/linuxArm64/debugTest/test.kexe \
            koblas-bench/build/bin/linuxArm64/debugTest/test.kexe
      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-tests
          path: build/linux-arm64-tests.tar.gz
          if-no-files-found: error

  test-linux-arm64:
    name: Run Linux arm64 native tests
    needs: build-linux-arm64-tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Download and verify Linux arm64 tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/download-artifact.sh
          "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" linux-arm64-tests build
      - name: Run portable native conformance on arm64
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          tar -xzf build/linux-arm64-tests.tar.gz
          mkdir -p build/test-results/linuxArm64
          koblas/build/bin/linuxArm64/debugTest/test.kexe 2>&1 | tee build/test-results/linuxArm64/koblas.log
          koblas-bench/build/bin/linuxArm64/debugTest/test.kexe 2>&1 | tee build/test-results/linuxArm64/koblas-bench.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux-arm64
          path: build/test-results/linuxArm64/
          if-no-files-found: ignore

  test-shared-jvm-artifact:
    name: Consume the shared JVM artifact on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 34]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Stage the shared Maven publication
        run: >-
          ./gradlew :koblas:publishJvmPublicationToLocalStagingRepository
          :koblas:publishKotlinMultiplatformPublicationToLocalStagingRepository
          -PciVersion=0.0.0-consumer
      - name: Install XML report tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxml2-utils
      - name: Verify the bytecode boundary and published JVM requirement
        run: |
          bash tests/verify-jvm-artifact.sh \
            koblas/build/libs/koblas-jvm-0.0.0-consumer.jar koblas/build/publications/jvm/module.json
          jar --validate --file koblas/build/libs/koblas-jvm-0.0.0-consumer.jar
      - name: Build JVM and Android consumers of the same publication
        run: >-
          ./gradlew -p tests/consumers --refresh-dependencies :jvm:jvm17Consumer :jvm:jvm25Consumer
          :jvm:jvm17ModuleConsumer :jvm:jvm25ModuleConsumer
          :android:assembleDebug :android:assembleRelease :android:assembleDebugAndroidTest
      - name: Verify both Android APKs contain only portable code
        run: |
          bash tests/verify-jvm-artifact.sh \
            koblas/build/libs/koblas-jvm-0.0.0-consumer.jar koblas/build/publications/jvm/module.json \
            tests/consumers/android/build/outputs/apk/debug/android-debug.apk \
            tests/consumers/android/build/outputs/apk/release/android-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ordinary and R8 consumers on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew -p tests/consumers :android:connectedDebugAndroidTest
            ./gradlew -p tests/consumers :android:connectedReleaseAndroidTest -Pconsumer.buildType=release
            bash tests/verify-test-results.sh tests/consumers/android/build/outputs/androidTest-results/connected/debug tests/consumers/android/build/outputs/androidTest-results/connected/release
      - name: Upload Android consumer test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-jvm-android-${{ matrix.api }}
          path: |
            tests/consumers/android/build/reports/androidTests/
            tests/consumers/android/build/outputs/androidTest-results/
          if-no-files-found: ignore
