name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# A newer push supersedes any in-flight run for the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Persists the Gradle home incl. the build and configuration caches across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run linter
        run: ./gradlew lintDocs

      - name: Run tests with coverage
        run: ./gradlew :koblas:check :koblas-bench:check :koblas:koverXmlReport

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore

      - name: Upload results to Codecov (main only)
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: koblas/build/reports/kover/report.xml
          flags: reference
          fail_ci_if_error: false

  # The bundled Maven package compiles its native library from source. Keep that work in its own job so
  # it runs beside the core, comparator, and macOS suites instead of extending the core feedback path.
  # Each job retains Gradle's cache setup and builds/tests its resources in the same workspace, avoiding a
  # serial artifact upload/download handoff and preserving the native tasks' normal build-cache behavior.
  test-bundled-native:
    name: Build and test the bundled native package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Cache bundled HFactor resources
        uses: actions/cache@v5
        with:
          path: koblas-hfactor/build/hfactor
          key: bundled-hfactor-${{ runner.os }}-${{ runner.arch }}-linux-x86_64-${{ hashFiles('koblas-hfactor/hfactor.lock', 'koblas-hfactor/native/*', 'scripts/third-party-notices.sh') }}

      - name: Build and test the bundled native package
        run: ./gradlew :koblas-hfactor:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-bundled-native
          path: |
            koblas-hfactor/build/reports/tests/
            koblas-hfactor/build/test-results/
          if-no-files-found: ignore

  # OpenBLAS is a development comparator owned by koblas-bench. Keep its installed-library validation in a
  # separate job so no published module acquires an external dependency or resource.
  test-openblas-comparator:
    name: Validate the OpenBLAS benchmark comparator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # The binding dlopens by soname, so the runtime libraries are what matter.
      #
      # Cached as .deb files, so a hit installs with no mirror access at all. Keyed on the image as well as
      # the package list: ubuntu-latest moves between releases, and unpacking one release's debs on another
      # would be worse than a slow download.
      - name: Cache the benchmark library packages
        id: host-packages
        uses: actions/cache@v5
        with:
          path: ~/host-packages
          key: benchmark-openblas-${{ runner.os }}-${{ env.ImageOS }}-v1

      # Generous on purpose: a slow mirror should cost time, never a red build. Observed downloads run 11 to
      # 18 seconds normally, 117 to 156 seconds on a degraded mirror that still works, and sometimes hang
      # indefinitely. Two earlier passes at this were cut too fine, 180s for the step and then 100s per
      # attempt, and both turned a working-but-slow install into a failure. The per-attempt cut is still what
      # makes the retry mean anything, since bounding only the step lets one hung attempt consume the lot.
      #
      # Only the download is bounded and retried. Unpacking is local and cannot hang on the network, and on a
      # cache hit nothing is downloaded at all.
      - name: Install OpenBLAS
        timeout-minutes: 30
        run: |
          set -eu
          packages="libopenblas0 libopenblas-dev"
          cache="$HOME/host-packages"
          # The runner's mirrorlist leads with azure.archive.ubuntu.com, which has been unreachable: apt waits
          # on it for every index file, logs Ign, and only then falls back to archive.ubuntu.com, which answers
          # fine. That accumulated per-index wait is the difference between an 11 second install and a 20
          # minute one. Pointing at the mirror that answers skips it, and a short acquire timeout keeps a
          # future dead host from being waited on rather than abandoned.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirrors"
            echo "mirrorlist now:"; cat "$mirrors"
          fi
          opts="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2"
          if [ -z "$(ls -A "$cache" 2>/dev/null || true)" ]; then
            mkdir -p "$cache"
            # Cleared first so the cache holds this closure and not whatever the image had lying around.
            sudo apt-get clean
            for attempt in 1 2; do
              if timeout 600 sudo apt-get $opts update && \
                 timeout 600 sudo apt-get $opts install -y --no-install-recommends --download-only $packages; then
                sudo cp /var/cache/apt/archives/*.deb "$cache"/
                sudo chown -R "$(id -u):$(id -g)" "$cache"
                break
              fi
              echo "attempt $attempt failed"
              # A killed apt can leave dpkg mid-transaction, which would fail the next attempt for an
              # unrelated reason.
              sudo dpkg --configure -a || true
              sleep 5
            done
          else
            echo "using $(ls -1 "$cache"/*.deb | wc -l) cached packages"
          fi
          if [ -z "$(ls -A "$cache" 2>/dev/null || true)" ]; then
            echo "::error::could not download OpenBLAS; the package mirror is likely unreachable"
            exit 1
          fi
          # One dpkg call over the whole closure, so it can work out the unpack and configure order itself.
          sudo dpkg -i "$cache"/*.deb

      # Fail here rather than let optional comparator tests return early on an absent library.
      - name: Verify the comparator soname
        run: |
          set -eu
          for soname in libopenblas.so.0; do
            if ! ldconfig -p | grep -q "$soname"; then
              echo "::error::$soname is not on the loader path; the benchmark comparator cannot run"
              exit 1
            fi
            echo "found $soname"
          done

      - name: Run comparator correctness tests
        run: >-
          ./gradlew :koblas-bench:jvmTest
          --tests com.eignex.koblas.bench.BenchmarkArmResolutionTest

      - name: Smoke-test JVM benchmark resolution
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:jvmSelectedBenchmark \
            -Pbench.include=Level3Benchmark.gemm \
            -Pbench.param.n=64 -Pbench.param.denseArm=openblas 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the JVM OpenBLAS comparator failed inside the benchmark fork"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas threading=1 thread' "$log"

      - name: Smoke-test Linux Native benchmark resolution
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          ./gradlew :koblas-bench:linuxX64SelectedBenchmark \
            -Pbench.include=Level3Benchmark.gemm \
            -Pbench.param.n=64 -Pbench.param.denseArm=openblas 2>&1 | tee "$log"
          if grep -Eq '<failure>|EXCEPTION: <ERROR>' "$log"; then
            echo "::error::the Linux Native OpenBLAS comparator failed inside the benchmark process"
            exit 1
          fi
          grep -q 'resolved: arm=openblas dense=openblas/cblas-native threading=1 thread' "$log"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-openblas-comparator
          path: |
            koblas-bench/build/reports/tests/
            koblas-bench/build/test-results/
          if-no-files-found: ignore

  # The Linux job cross-compiles the macOS klibs but cannot link or run them; this job exercises
  # the native tests on Apple Silicon.
  test-macos:
    name: Run native tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run native tests
        run: ./gradlew :koblas:macosArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: |
            koblas/build/reports/tests/
            koblas/build/test-results/
          if-no-files-found: ignore
